<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Audio Player Example</title>
  <style>


 .titulo {

   
       background: linear-gradient(to right, #ff7e5f, #de8f52);
      border-radius: 8px;
      width:100%;
      height: 200px;
    
       font-size: 100px;
       display: flex;
       justify-content: center; /* Horizontal */
       align-items: center;    /* Vertical */
          

    }

    body { background: linear-gradient(to right, #7caee3, #4923b0);
 
}



    .video-player {
      margin: 200px 0;
      padding: 15px;
      background-color: #da2929;
      border-radius: 8px;
      width:600px;
      margin-left: 40%;
    }

   

  .audio-player {
      margin: 200px 0;
      padding: 15px;
      background-color: #061ba4;
      border-radius: 8px;
      width:300px;
      margin-left: 40%;
       z-index: 2;
       margin-top: 10px;
    }


     .audio-player2 {
      margin: 200px 0;
      padding: 15px;
      background-color: #a3297a;
      border-radius: 8px;
      width:600px;
      margin-left: 40%;
       z-index: 2;
    }

    
    .audio-title {
      margin-bottom: 10px;
      color: #333;
    }

 .video-title {
      margin-bottom: 10px;
      color: #0d1ed6;
    }



  </style>
</head>
<body>

     <div class="titulo" style:text>ELEMENTOS MULTIMEDIA</div>


  <div class="audio-player">
    <h3 class="audio-title">Reprodutor Audio Local</h3>
    <audio src="musica/audio.mp3" controls autoplay loop></audio>
   
  </div>


   <div class="video-player">
    <h3 class="video-title">Reproductor Video Youtube</h3>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/PPOXTUL4ytk?si=MHQWGxyTcMQIEocm" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

  </div>


  <div class="audio-player2" >
    
    <img src="mascara.png" alt="audio" width="530" height="227">
   
  </div>

  
 
</body>
</html>
