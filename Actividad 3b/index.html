<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Alfonso Rubio Rioseras">
  <title>Galería de imágenes</title>
  <style>
    .cuerpo {
      background: linear-gradient(135deg, #9f999d 0%, #646565 100%);
      padding: 40px 30px;
      text-align: center;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      color: #fff;
    }

    .cabecera {
      background: linear-gradient(135deg, #ad1f79 0%, #6575cf 100%);
      padding: 40px 30px;
      text-align: center;
      border-bottom: 3px solid #3b82f6;
      font-size: larger;
    }

    .galeria {
      background: linear-gradient(135deg, #615d60 0%, #3c3d41 100%);
      padding: 40px 30px;
      text-align: center;
      border-bottom: 3px solid #3b82f6;
      min-height: 400px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
    }

    .pie {
      background: linear-gradient(135deg, #ad1c89 0%, #1ebe81 100%);
      padding: 40px 20px;
      text-align: center;
      border-top: 3px solid #3b82f6;
    }

    .bw-hover {
      filter: grayscale(100%);
      transition: filter 0.3s ease, transform 0.3s ease;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .bw-hover:hover {
      filter: grayscale(0%);
      transform: scale(1.05);
    }

    img {
      max-width: 100%;
      height: auto;
    }
  </style>
</head>

<body class="cuerpo">

  <header class="cabecera">
    <h1>Galería de imágenes</h1>
  </header>

  <!-- Galería -->
  <div class="galeria">
    <a href="img/diapositiva1.jpg" target="_blank">
      <img class="bw-hover" src="img/diapositiva1.jpg" width="400" height="225" alt="Coche deportivo de lujo"
        title="Coche deportivo de lujo">
    </a>
    <a href="img/diapositiva2.jpg" target="_blank">
      <img class="bw-hover" src="img/diapositiva2.jpg" width="400" height="225"
        alt="Vehículo deportivo de alta gama" title="Vehículo deportivo de alta gama">
    </a>
    <a href="img/diapositiva3.jpg" target="_blank">
      <img class="bw-hover" src="img/diapositiva3.jpg" width="400" height="225"
        alt="Coche de carreras deportivo" title="Coche de carreras deportivo">
    </a>
    <a href="img/diapositiva4.jpg" target="_blank">
      <img class="bw-hover" src="img/diapositiva4.jpg" width="400" height="225"
        alt="Concepto de coche deportivo moderno" title="Concepto de coche deportivo moderno">
    </a>
  </div>

  <!-- Footer -->
  <footer class="pie">
    <p>© 2026 — Alfonso Rubio Rioseras</p>
  </footer>

</body>

</html>
