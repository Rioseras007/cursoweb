<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alfonso Rubio Rioseras">
    <meta name="description" content="Dashboard de control y portfolio de actividades del curso de programación web">
    <title>Dashboard Control Actividades | Curso Online</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        /* ============ RESET & VARIABLES ============ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --bg-card-hover: #1a2744;
            --accent-1: #0f3460;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-success: #34d399;
            --accent-warning: #fbbf24;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6c6c88;
            --border-color: rgba(255, 255, 255, 0.06);
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-card-hover: 0 8px 40px rgba(102, 126, 234, 0.15);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============ GLOBAL ============ */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ============ BACKGROUND DECORATION ============ */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.04) 0%, transparent 50%);
            z-index: -1;
            animation: bgFloat 20s ease-in-out infinite alternate;
        }

        @keyframes bgFloat {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(-20px, -20px);
            }
        }

        /* ============ HEADER ============ */
        header {
            text-align: center;
            padding: 60px 20px 40px;
        }

        .header-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 18px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #a0a0b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 500px;
            margin: 0 auto;
        }

        /* ============ FILTERS ============ */
        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 24px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .filter-btn:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .filter-btn.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        /* ============ PROGRESS BAR ============ */
        .progress-section {
            max-width: 800px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-success);
            border-radius: 10px;
            transition: width 1s ease-out;
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
        }

        /* ============ GRID ============ */
        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* ============ CARD ============ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 28px 24px;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all var(--transition);
        }

        .card.status-completada:hover {
            transform: translateY(-4px);
            border-color: rgba(52, 211, 153, 0.3);
            box-shadow: 0 8px 30px rgba(52, 211, 153, 0.08);
        }

        .card.status-pendiente {
            opacity: 0.7;
            background: rgba(22, 33, 62, 0.5);
            pointer-events: none;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .card-number {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            flex-grow: 1;
            margin-bottom: 24px;
        }

        /* ============ BADGES ============ */
        .card-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 50px;
        }

        .badge-completada {
            background: rgba(52, 211, 153, 0.1);
            color: var(--accent-success);
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .badge-pendiente {
            background: rgba(251, 191, 36, 0.1);
            color: var(--accent-warning);
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-badge">Control Panel</div>
        <h1>Dashboard de Actividades</h1>
        <p>Monitorización del progreso del curso de Programación de Páginas Web. Alfonso Rubio Rioseras.</p>
    </header>

    <section class="progress-section">
        <div class="progress-label">
            <span>Progreso General</span>
            <span id="progress-text">Calculando...</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </section>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="completada">Completadas</button>
        <button class="filter-btn" data-filter="pendiente">Pendientes</button>
    </div>

    <main class="grid-container" id="activities-grid">
        <!-- Cards injected by JS -->
    </main>

    <script>
        const activities = [
            // Unidad Didáctica 1
            { id: 'UD1-01', title: 'UD1 - Caso Práctico 1', desc: 'Introducción al HTML. Etiquetas head, meta, title y estructura.', status: 'completada', link: 'Unidad didactica 1/Actividad _01/web.html' },
            { id: 'UD1-02', title: 'UD1 - Caso Práctico 2', desc: 'Fichero estadístico, imagen de referencia al lado.', status: 'pendiente', link: '#' },
            { id: 'UD1-03', title: 'UD1 - Caso Práctico 3', desc: 'Formatos de texto, párrafos, alineación y separadores.', status: 'completada', link: 'Unidad didactica 1/Actividad_03/Actividad3.html' },
            { id: 'UD1-04', title: 'UD1 - Caso Práctico 4', desc: 'Elementos especiales, subíndices y química/matemáticas.', status: 'completada', link: 'Unidad didactica 1/Actividad _04/Actividad4.html' },
            { id: 'UD1-05', title: 'UD1 - Caso Práctico 5', desc: 'Texto preformateado y poema de Bécquer.', status: 'completada', link: 'Unidad didactica 1/Actvidad_05/Actividad5.html' },
            { id: 'UD1-06', title: 'UD1 - Caso Práctico 6', desc: 'Uso de tablas para estructurar información tabular.', status: 'completada', link: 'Unidad didactica 1/Actvidad_06/Actividad6.html' },
            { id: 'UD1-06b', title: 'UD1 - Tablas avanzadas', desc: 'Diseño complejo de tablas con fusiones.', status: 'completada', link: 'Unidad didactica 1/Actvidad_06/Actividad6b.html' },
            { id: 'UD1-07A', title: 'UD1 - Práctica 7A', desc: 'Práctica A de la serie 7.', status: 'completada', link: 'Unidad didactica 1/Actividad_07/Actividad_7A.html' },
            { id: 'UD1-07B', title: 'UD1 - Práctica 7B', desc: 'Práctica B de la serie 7.', status: 'completada', link: 'Unidad didactica 1/Actividad_07/Actividad_7B.html' },
            { id: 'UD1-08', title: 'UD1 - Listas', desc: 'Listas ordenadas, desordenadas y de definición.', status: 'completada', link: 'Unidad didactica 1/Actividad_08/Actividad_8.html' },
            { id: 'UD1-09', title: 'UD1 - Contacto', desc: 'Sistema de secciones interconectadas.', status: 'completada', link: 'Unidad didactica 1/Actvidad_09/principal.html' },
            { id: 'UD1-10', title: 'UD1 - Frames', desc: 'Estructuración de páginas usando frames/marcos.', status: 'completada', link: 'Unidad didactica 1/Actividad 10/index.html' },
            { id: 'UD1-11', title: 'UD1 - Práctica Final', desc: 'Integra conceptos de unidades anteriores.', status: 'completada', link: 'Unidad didactica 1/Actividad 11/Actividad_11.html' },
            { id: 'UD1-12', title: 'UD1 - Proyecto Clínico', desc: 'Proyecto completo de estructura clínica con varios apartados.', status: 'completada', link: 'Unidad didactica 1/Actividad 12/index.html' },

            // Unidad Didáctica 2
            { id: 'UD2-01', title: 'UD2 - Actividad 1', desc: 'Actividad pendiente unidad 2.', status: 'pendiente', link: '#' },
            { id: 'UD2-02', title: 'UD2 - Actividad 2', desc: 'Actividad alternativa.', status: 'completada', link: 'Unidad didactica 2/Actvidad_02/Actividad2.html' },
            { id: 'UD2-03', title: 'UD2 - Actividad 3', desc: 'Ampliación de formatos de texto.', status: 'completada', link: 'Unidad didactica 2/Actividad_03/index.html' },
            { id: 'UD2-04', title: 'UD2 - Imagen Mapeable', desc: 'Mapeo de zonas de imagen con enlaces interactivos.', status: 'completada', link: 'Unidad didactica 2/Actividad_04/index.html' },
            { id: 'UD2-05', title: 'UD2 - Formularios', desc: 'Creación de controles de formulario para captura de datos.', status: 'completada', link: 'Unidad didactica 2/Actividad_05/index.html' },

            // Unidad Didáctica 3
            { id: 'UD3-01', title: 'UD3 - CSS Introducción', desc: 'Actividades de introducción a hojas de estilo.', status: 'completada', link: 'Unidad didactica 3/CSS/Actividad 1/index_con_css_externo.html' },

            // Unidad Didáctica 4
            { id: 'UD4-01', title: 'UD4 - Actividad 1', desc: 'Actividad de la unidad 4.', status: 'pendiente', link: '#' },
            { id: 'UD4-02', title: 'UD4 - Actividad 2', desc: 'Actividad de la unidad 4.', status: 'pendiente', link: '#' },

            // Actividades Raíz
            { id: 'R-01', title: 'Raíz - Actividad 1', desc: 'Introducción HTML.', status: 'completada', link: 'Actividad 1/web.html' },
            { id: 'R-02', title: 'Raíz - Actividad 2', desc: 'Actividad pendiente.', status: 'pendiente', link: '#' },
            { id: 'R-02b', title: 'Raíz - Actividad 2b', desc: 'Versión alternativa.', status: 'completada', link: 'Actvidad 2b/Actividad2.html' },
            { id: 'R-03', title: 'Raíz - Actividad 3', desc: 'Formatos.', status: 'completada', link: 'Actividad 3/Actividad3.html' },
            { id: 'R-03b', title: 'Raíz - Actividad 3b', desc: 'Formatos ampl.', status: 'completada', link: 'Actividad 3b/index.html' },
            { id: 'R-04', title: 'Raíz - Actividad 4', desc: 'Especiales.', status: 'completada', link: 'Actividad 4/Actividad4.html' },
            { id: 'R-04b', title: 'Raíz - Actividad 4b', desc: 'Mapeo.', status: 'completada', link: 'Actividad 4b/index.html' },
            { id: 'R-05', title: 'Raíz - Actividad 5', desc: 'Preformateado.', status: 'completada', link: 'Actvidad 5/Actividad5.html' },
            { id: 'R-05b', title: 'Raíz - Actividad 5b', desc: 'Formularios.', status: 'completada', link: 'Actividad 5b/index.html' },
            { id: 'R-06', title: 'Raíz - Actividad 6', desc: 'Tablas.', status: 'completada', link: 'Actvidad 6/Actividad6.html' },
            { id: 'R-06b', title: 'Raíz - Actividad 6b', desc: 'Tablas Av.', status: 'completada', link: 'Actvidad 6/Actividad6b.html' },
            { id: 'R-07A', title: 'Raíz - Actividad 7A', desc: 'Práctica A.', status: 'completada', link: 'Actividad 7/Actividad_7A.html' },
            { id: 'R-07B', title: 'Raíz - Actividad 7B', desc: 'Práctica B.', status: 'completada', link: 'Actividad 7/Actividad_7B.html' },
            { id: 'R-08', title: 'Raíz - Actividad 8', desc: 'Listas.', status: 'completada', link: 'Actividad 8/Actividad_8.html' },
            { id: 'R-09', title: 'Raíz - Actividad 9', desc: 'Contacto.', status: 'completada', link: 'Actvidad 9/principal.html' },
            { id: 'R-10', title: 'Raíz - Actividad 10', desc: 'Frames.', status: 'completada', link: 'Actividad 10/index.html' },
            { id: 'R-11', title: 'Raíz - Actividad 11', desc: 'Final.', status: 'completada', link: 'Actividad 11/Actividad_11.html' },
            { id: 'R-12', title: 'Raíz - Actividad 12', desc: 'Clínico.', status: 'completada', link: 'Actividad 12/index.html' }
        ];

        const grid = document.getElementById('activities-grid');
        const progressText = document.getElementById('progress-text');
        const progressFill = document.getElementById('progress-fill');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function renderActivities(filter = 'all') {
            grid.innerHTML = '';

            let visibleCount = 0;
            let completedCount = 0;

            activities.forEach(act => {
                if (act.status === 'completada') completedCount++;

                if (filter === 'all' || filter === act.status) {
                    visibleCount++;
                    const isCompleted = act.status === 'completada';

                    const el = document.createElement(isCompleted ? 'a' : 'div');
                    el.className = `card status-${act.status}`;
                    if (isCompleted) el.href = act.link;

                    el.innerHTML = `
                        <div class="card-header">
                            <div class="card-number">${act.id}</div>
                            <span class="card-badge badge-${act.status}">
                                <div class="status-dot"></div>
                                ${isCompleted ? 'Completada' : 'Pendiente'}
                            </span>
                        </div>
                        <div class="card-title">${act.title}</div>
                        <div class="card-description">${act.desc}</div>
                    `;
                    grid.appendChild(el);
                }
            });

            // Update Progress on 'all'
            if (filter === 'all') {
                const perc = Math.round((completedCount / activities.length) * 100);
                progressText.textContent = `${completedCount} de ${activities.length} completadas (${perc}%)`;
                setTimeout(() => { progressFill.style.width = `${perc}%`; }, 100);
            }
        }

        // Initialize
        renderActivities();

        // Filters Event Listeners
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderActivities(btn.dataset.filter);
            });
        });
    </script>

</body>

</html>
