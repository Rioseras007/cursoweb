<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Alfonso Rubio Rioseras">
    <meta name="description"
        content="Dashboard de control y portfolio de actividades del curso de programación web (Unidades Didácticas)">
    <title>Dashboard Unidades Didácticas | Curso Online</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
        /* ============ RESET & VARIABLES ============ */
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0f0f1a;
            --bg-secondary: #1a1a2e;
            --bg-card: #16213e;
            --bg-card-hover: #1a2744;
            --accent-1: #0f3460;
            --accent-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --accent-success: #34d399;
            --accent-warning: #fbbf24;
            --text-primary: #e8e8f0;
            --text-secondary: #a0a0b8;
            --text-muted: #6c6c88;
            --border-color: rgba(255, 255, 255, 0.06);
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.3);
            --shadow-card-hover: 0 8px 40px rgba(102, 126, 234, 0.15);
            --radius: 16px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ============ GLOBAL ============ */
        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* ============ BACKGROUND DECORATION ============ */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 20% 50%, rgba(102, 126, 234, 0.04) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(118, 75, 162, 0.04) 0%, transparent 50%);
            z-index: -1;
            animation: bgFloat 20s ease-in-out infinite alternate;
        }

        @keyframes bgFloat {
            0% {
                transform: translate(0, 0);
            }

            100% {
                transform: translate(-20px, -20px);
            }
        }

        /* ============ HEADER ============ */
        header {
            text-align: center;
            padding: 60px 20px 40px;
        }

        .header-badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 18px;
            border-radius: 50px;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff, #a0a0b8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        header p {
            color: var(--text-secondary);
            font-size: 1.05rem;
            max-width: 500px;
            margin: 0 auto;
        }

        /* ============ FILTERS ============ */
        .filters {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            padding: 0 20px;
        }

        .filter-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 10px 24px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all var(--transition);
        }

        .filter-btn:hover {
            color: var(--text-primary);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .filter-btn.active {
            background: var(--accent-gradient);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        /* ============ PROGRESS BAR ============ */
        .progress-section {
            max-width: 800px;
            margin: 0 auto 50px;
            padding: 0 20px;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent-success);
            border-radius: 10px;
            transition: width 1s ease-out;
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
        }

        /* ============ GRID ============ */
        .grid-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 80px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        /* ============ CARD ============ */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            color: inherit;
            display: flex;
            flex-direction: column;
            position: relative;
            transition: all var(--transition);
        }

        .card.status-completada:hover {
            transform: translateY(-4px);
            border-color: rgba(52, 211, 153, 0.3);
            box-shadow: 0 8px 30px rgba(52, 211, 153, 0.08);
        }

        .card.status-pendiente {
            opacity: 0.7;
            background: rgba(22, 33, 62, 0.5);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .card-number {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            line-height: 1;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .card-description {
            font-size: 0.9rem;
            color: var(--text-secondary);
            flex-grow: 1;
            margin-bottom: 24px;
        }

        /* ============ BADGES ============ */
        .card-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 50px;
        }

        .badge-completada {
            background: rgba(52, 211, 153, 0.1);
            color: var(--accent-success);
            border: 1px solid rgba(52, 211, 153, 0.2);
        }

        .badge-pendiente {
            background: rgba(251, 191, 36, 0.1);
            color: var(--accent-warning);
            border: 1px solid rgba(251, 191, 36, 0.2);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: currentColor;
            box-shadow: 0 0 8px currentColor;
        }

        /* ============ LINKS (BUTTONS) ============ */
        .card-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: auto;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            padding: 8px 14px;
            border-radius: 8px;
            text-decoration: none;
            transition: all var(--transition);
        }

        .btn-html {
            background: rgba(102, 126, 234, 0.1);
            color: #8b9af0;
            border: 1px solid rgba(102, 126, 234, 0.2);
        }

        .btn-html:hover {
            background: rgba(102, 126, 234, 0.2);
            color: #ffffff;
        }

        .btn-pdf {
            background: rgba(239, 68, 68, 0.1);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .btn-pdf:hover {
            background: rgba(239, 68, 68, 0.2);
            color: #ffffff;
        }

        .btn-zip {
            background: rgba(245, 158, 11, 0.1);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }

        .btn-zip:hover {
            background: rgba(245, 158, 11, 0.2);
            color: #ffffff;
        }

        .hidden {
            display: none !important;
        }

        @media (max-width: 640px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-badge">Control Panel</div>
        <h1>Dashboard - Unidades Didácticas</h1>
        <p>Monitorización del progreso exclusivo de actividades por módulos. Alfonso Rubio Rioseras.</p>
    </header>

    <section class="progress-section">
        <div class="progress-label">
            <span>Progreso General</span>
            <span id="progress-text">Calculando...</span>
        </div>
        <div class="progress-bar-bg">
            <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
    </section>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">Todas</button>
        <button class="filter-btn" data-filter="completada">Completadas</button>
        <button class="filter-btn" data-filter="pendiente">Pendientes</button>
    </div>

    <main class="grid-container" id="activities-grid">
        <!-- Cards injected by JS -->
    </main>

    <script>
        const activities = [
            // Unidad Didáctica 1
            {
                id: 'UD1-01', title: 'Caso Práctico 1', desc: 'Introducción al HTML. Etiquetas head, meta, title.', status: 'completada',
                linkHtml: 'Unidad didactica 1/Actividad _01/web.html'
            },
            {
                id: 'UD1-03', title: 'Caso Práctico 3', desc: 'Formatos de texto, párrafos, alineación y separadores.', status: 'completada',
                linkHtml: 'Unidad didactica 1/Actividad_03/Actividad3.html',
                linkZip: 'Unidad didactica 1/Actividad_03/Actividad3.zip'
            },
            {
                id: 'UD1-04', title: 'Caso Práctico 4', desc: 'Elementos especiales, subíndices y química/matemáticas.', status: 'completada',
                linkHtml: 'Unidad didactica 1/Actividad _04/Actividad4.html',
                linkZip: 'Unidad didactica 1/Actividad _04/Actividad4.zip'
            },
            {
                id: 'UD1-05', title: 'Caso Práctico 5', desc: 'Texto preformateado y poema de Bécquer.', status: 'completada',
                linkHtml: 'Unidad didactica 1/Actvidad_05/Actividad5.html',
                linkZip: 'Unidad didactica 1/Actvidad_05/Actividad5.zip'
            },
            {
                id: 'UD1-06', title: 'Caso Práctico 6', desc: 'Uso de tablas para estructurar información tabular.', status: 'completada',
                linkHtml: 'Unidad didactica 1/Actvidad_06/Actividad6.html',
                linkZip: 'Unidad didactica 1/Actvidad_06/Actvidad 6.zip'
            },
            {
                id: 'UD1-07', title: 'Caso Práctico 7', desc: 'Prácticas A y B de la serie 7.', status: 'completada',
                linkHtml: 'Unidad didactica 1/Actividad_07/Actividad_7A.html',
                linkZip: 'Unidad didactica 1/Actividad_07/Actividad 7.zip'
            },
            {
                id: 'UD1-08', title: 'Listas', desc: 'Listas ordenadas, desordenadas y de definición.', status: 'completada',
                linkHtml: 'Unidad didactica 1/Actividad_08/Actividad_8.html',
                linkZip: 'Unidad didactica 1/Actividad_08/Actividad_8.zip'
            },
            {
                id: 'UD1-09', title: 'Contacto', desc: 'Sistema de secciones interconectadas.', status: 'completada',
                linkHtml: 'Unidad didactica 1/Actvidad_09/principal.html',
                linkPdf: 'Unidad didactica 1/Actvidad_09/cv.pdf',
                linkZip: 'Unidad didactica 1/Actvidad_09/Actividad9.zip'
            },
            {
                id: 'UD1-10', title: 'Frames', desc: 'Estructuración de páginas usando frames/marcos.', status: 'completada',
                linkHtml: 'Unidad didactica 1/Actividad 10/index.html',
                linkZip: 'Unidad didactica 1/Actividad 10/Actividad 10.zip'
            },
            {
                id: 'UD1-11', title: 'Práctica Final', desc: 'Integra conceptos de unidades anteriores.', status: 'completada',
                linkHtml: 'Unidad didactica 1/Actividad 11/Actividad_11.html',
                linkZip: 'Unidad didactica 1/Actividad 11/Actividad_11.zip'
            },
            {
                id: 'UD1-12', title: 'Proyecto Clínico', desc: 'Proyecto completo de estructura clínica con varios apartados.', status: 'completada',
                linkHtml: 'Unidad didactica 1/Actividad 12/index.html',
                linkZip: 'Unidad didactica 1/Actividad 12/Actividad 12.zip'
            },

            // Unidad Didáctica 2
            {
                id: 'UD2-01', title: 'Actividad 1', desc: 'Documento PDF de referencia unidad 2.', status: 'completada',
                linkPdf: 'Unidad didactica 2/Actividad_01/Actividad_01.pdf'
            },
            {
                id: 'UD2-02', title: 'Actividad 2b', desc: 'Versión alternativa unidad 2.', status: 'completada',
                linkHtml: 'Unidad didactica 2/Actvidad_02/Actividad2.html',
                linkZip: 'Unidad didactica 2/Actvidad_02/Actvidad 2b.zip'
            },
            {
                id: 'UD2-03', title: 'Actividad 3b', desc: 'Ampliación de formatos de texto.', status: 'completada',
                linkHtml: 'Unidad didactica 2/Actividad_03/index.html',
                linkZip: 'Unidad didactica 2/Actividad_03/Actividad 3b.zip'
            },
            {
                id: 'UD2-04', title: 'Actividad 4b', desc: 'Mapeo de zonas de imagen con enlaces.', status: 'completada',
                linkHtml: 'Unidad didactica 2/Actividad_04/index.html',
                linkZip: 'Unidad didactica 2/Actividad_04/Actividad 4b.zip'
            },
            {
                id: 'UD2-05', title: 'Actividad 5b', desc: 'Controles de formulario.', status: 'completada',
                linkHtml: 'Unidad didactica 2/Actividad_05/index.html',
                linkZip: 'Unidad didactica 2/Actividad_05/Actividad 5b.zip'
            },

            // Unidad Didáctica 3
            {
                id: 'UD3-01', title: 'CSS Intro', desc: 'Introducción a hojas de estilo.', status: 'completada',
                linkHtml: 'Unidad didactica 3/CSS/Actividad 1/index_con_css_externo.html',
                linkPdf: 'Unidad didactica 3/CSS/Actividad 1/Actvidad 1_CSS.pdf',
                linkZip: 'Unidad didactica 3/CSS/Actividad 1/Actividad 1.zip'
            },

            // Unidad Didáctica 4
            {
                id: 'UD4-01', title: 'Actividad 1', desc: 'Solución maquetada Unidad 4.', status: 'completada',
                linkPdf: 'Unidad didactica 4/Actividad_01/Solucion maquetada.pdf',
                linkZip: 'Unidad didactica 4/Actividad_01/Actividad_01.zip'
            },
            {
                id: 'UD4-02', title: 'Actividad 2', desc: 'No hay archivos en la carpeta Actividad_02 de Unidad Didáctica 4 todavía.', status: 'pendiente'
            }
        ];

        const grid = document.getElementById('activities-grid');
        const progressText = document.getElementById('progress-text');
        const progressFill = document.getElementById('progress-fill');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function generateLinks(act) {
            let links = '';
            // Si está pendiente, no mostramos botones
            if (act.status === 'pendiente') return '';

            if (act.linkHtml) {
                links += `<a href="${act.linkHtml}" class="action-btn btn-html" target="_blank">📄 Ver Web</a>`;
            }
            if (act.linkPdf) {
                links += `<a href="${act.linkPdf}" class="action-btn btn-pdf" target="_blank">📕 Ver PDF</a>`;
            }
            if (act.linkZip) {
                links += `<a href="${act.linkZip}" class="action-btn btn-zip" download>📦 Descargar ZIP</a>`;
            }
            return links;
        }

        function renderActivities(filter = 'all') {
            grid.innerHTML = '';

            let visibleCount = 0;
            let completedCount = 0;

            activities.forEach(act => {
                if (act.status === 'completada') completedCount++;

                if (filter === 'all' || filter === act.status) {
                    visibleCount++;
                    const isCompleted = act.status === 'completada';

                    const el = document.createElement('div');
                    el.className = `card status-${act.status}`;

                    el.innerHTML = `
                        <div class="card-header">
                            <div class="card-number">${act.id}</div>
                            <span class="card-badge badge-${act.status}">
                                <div class="status-dot"></div>
                                ${isCompleted ? 'Completada' : 'Pendiente'}
                            </span>
                        </div>
                        <div class="card-title">${act.title}</div>
                        <div class="card-description">${act.desc}</div>
                        <div class="card-actions">
                            ${generateLinks(act)}
                        </div>
                    `;
                    grid.appendChild(el);
                }
            });

            // Update Progress on 'all'
            if (filter === 'all') {
                const perc = Math.round((completedCount / activities.length) * 100);
                progressText.textContent = `${completedCount} de ${activities.length} completadas (${perc}%)`;
                setTimeout(() => { progressFill.style.width = `${perc}%`; }, 100);
            }
        }

        // Initialize
        renderActivities();

        // Filters Event Listeners
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderActivities(btn.dataset.filter);
            });
        });
    </script>

</body>

</html>
