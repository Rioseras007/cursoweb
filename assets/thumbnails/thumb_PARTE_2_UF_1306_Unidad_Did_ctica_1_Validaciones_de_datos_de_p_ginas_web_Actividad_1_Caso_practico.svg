<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a9d8f" />
      <stop offset="100%" stop-color="#264653" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="340" fill="url(#grad)" />
  
  <!-- Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="340"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="300" y1="0" x2="300" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="500" y1="0" x2="500" y2="340"/>
  </g>

  <!-- Frame -->
  <rect x="35" y="30" width="530" height="280" rx="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.22)" stroke-width="1.5" filter="url(#shadow)"/>

  <!-- Top bar -->
  <rect x="35" y="30" width="530" height="46" rx="18" fill="rgba(0,0,0,0.22)" />
  <circle cx="62" cy="53" r="5" fill="#ff5f56" />
  <circle cx="79" cy="53" r="5" fill="#ffbd2e" />
  <circle cx="96" cy="53" r="5" fill="#27c93f" />

  <!-- Module Badge -->
  <rect x="425" y="41" width="120" height="24" rx="12" fill="#e9c46a" opacity="0.95" />
  <text x="485" y="57" fill="#0c1c25" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">UF1306</text>

  <!-- Central Icon -->
  <g transform="translate(60, 110) scale(1.8)">
    <path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" fill="none" stroke="#e9c46a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Text Info -->
  <text x="125" y="130" fill="#e9c46a" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.5">VALIDACIÓN Y EFECTOS</text>
  
  <text x="60" y="195" fill="#ffffff" font-family="system-ui, sans-serif" font-size="22" font-weight="bold">Actividad 1 - Caso practico</text>
  
  <text x="60" y="235" fill="rgba(255,255,255,0.8)" font-family="system-ui, sans-serif" font-size="14">Unidad Didáctica 1. Validaciones de datos de páginas web</text>
</svg>