<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Alfonso Rubio Rioseras">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Nuevo Usuario</title>
</head>

<body>
    <div id="contenedor" style="width: 400px; margin: 200px auto; padding: 60px; border: 1px solid #2c71cb; border-radius: 5px; background-color: #a7dff9;">
        <form action="enviado.html" method="POST" name="NuevoUsuarioForm" id="NuevoUsuarioForm">
            <table border="1">
                <caption>Formulario Nuevo Usuario</caption>
                <tr>
                    <td width="150"><label for="nombre">Nombre:</label></td>
                    <td><input type="text" id="nombre" name="nombre" required maxlength="50"></td>
                </tr>
                <tr>
                    <td width="150"><label for="apellido">Apellido:</label></td>
                    <td><input type="text" id="apellido" name="apellido" required maxlength="50"></td>
                </tr>
                <tr>
                    <td width="150"><label for="email">Correo Electrónico:</label></td>
                    <td><input type="email" id="email" name="email" required></td>
                </tr>
                <tr>
                    <td width="150"><label for="password">Contraseña:</label></td>
                    <td><input type="password" id="password" name="password" required maxlength="8"></td>
                </tr>
                <tr>
                    <td width="150"><label for="foto">Foto:</label></td>
                    <td><input type="file" id="foto" name="foto" accept="image/*"></td>
                </tr>
                <tr style="display:none;">
                    <td colspan="2"><input type="hidden" name="tipo_usuario" value="amigo"></td>
                </tr>
                <tr class="buttons-row">
                    <td colspan="2" style="text-align: center;">
                        <button type="submit">Registrar</button>
                        <button type="reset">Borrar</button>
                        <button type="button" disabled>Botón fuera de servicio</button>
                    </td>
                </tr>
            </table>
        </form>

        <script>
            window.onload = function() {
                document.NuevoUsuarioForm.email.focus();
            };
        </script>

    </div>

    <footer>
        <p style="text-align: center; margin-top: 20px;">&copy; 2026 Alfonso Rubio Rioseras. Todos los derechos reservados.</p>
    </footer>
</body>
</html>












</html>
